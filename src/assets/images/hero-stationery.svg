<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" fill="none">
  <defs>
    <linearGradient id="bgHero" x1="0" y1="0" x2="720" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F1E7" />
      <stop offset="100%" stop-color="#EAEFE7" />
    </linearGradient>
    <filter id="shadowSoft" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#243026" flood-opacity="0.12" />
    </filter>
    <filter id="shadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#243026" flood-opacity="0.1" />
    </filter>
  </defs>
  <rect width="720" height="560" rx="28" fill="url(#bgHero)" />
  <circle cx="590" cy="110" r="115" fill="#E7EFE5" opacity="0.85" />
  <circle cx="130" cy="450" r="95" fill="#FDF0E9" opacity="0.9" />

  <!-- Wooden Desk Pad -->
  <rect x="78" y="88" width="420" height="330" rx="18" fill="#FAF7F2" stroke="#DCE2D7" stroke-width="2" filter="url(#shadowSoft)" />

  <!-- Sage Hardcover Notebook -->
  <g transform="translate(115 120) rotate(-6)" filter="url(#shadowSoft)">
    <rect x="0" y="0" width="210" height="275" rx="14" fill="#5F7A61" />
    <rect x="14" y="0" width="8" height="275" fill="#475E49" />
    <rect x="44" y="48" width="128" height="62" rx="8" fill="#FAF7F2" opacity="0.94" />
    <rect x="64" y="68" width="88" height="7" rx="3.5" fill="#5F7A61" />
    <rect x="76" y="84" width="64" height="5" rx="2.5" fill="#9BB09D" />
    <rect x="184" y="0" width="8" height="275" rx="2" fill="#E59065" />
    <path d="M150 275 L150 302 L160 293 L170 302 L170 275 Z" fill="#E59065" />
  </g>

  <!-- Open Cream Sketchbook / Planner -->
  <g transform="translate(295 152) rotate(5)" filter="url(#shadowSoft)">
    <rect x="0" y="0" width="248" height="284" rx="12" fill="#FFFFFF" stroke="#E1E5DD" stroke-width="2" />
    <line x1="28" y1="44" x2="220" y2="44" stroke="#E7EFE5" stroke-width="14" stroke-linecap="round" />
    <rect x="34" y="40" width="86" height="8" rx="4" fill="#5F7A61" />
    <g stroke="#E6EAE2" stroke-width="1.6">
      <line x1="30" y1="84" x2="218" y2="84" />
      <line x1="30" y1="116" x2="218" y2="116" />
      <line x1="30" y1="148" x2="218" y2="148" />
      <line x1="30" y1="180" x2="218" y2="180" />
      <line x1="30" y1="212" x2="218" y2="212" />
      <line x1="30" y1="244" x2="170" y2="244" />
    </g>
    <circle cx="44" cy="100" r="6" fill="#E59065" opacity="0.85" />
    <circle cx="44" cy="132" r="6" fill="#5F7A61" opacity="0.85" />
    <circle cx="44" cy="164" r="6" fill="#E59065" opacity="0.55" />
  </g>

  <!-- Pastel Gel Pen & Brass Pencil -->
  <g transform="translate(532 108) rotate(14)" filter="url(#shadowSm)">
    <rect x="0" y="24" width="22" height="220" rx="11" fill="#E59065" />
    <rect x="3" y="20" width="16" height="58" rx="7" fill="#D57B4E" />
    <polygon points="11,266 3,242 19,242" fill="#FAF7F2" />
    <polygon points="11,266 8,256 14,256" fill="#243026" />
  </g>
  <g transform="translate(580 132) rotate(18)" filter="url(#shadowSm)">
    <rect x="0" y="18" width="16" height="218" rx="6" fill="#D0AE65" />
    <rect x="2" y="12" width="12" height="22" rx="4" fill="#5F7A61" />
    <polygon points="8,256 2,235 14,235" fill="#B59148" />
  </g>

  <!-- Sticky Notes Stack -->
  <g transform="translate(88 378) rotate(-8)" filter="url(#shadowSm)">
    <rect x="8" y="8" width="112" height="106" rx="8" fill="#FCE5D7" />
    <rect x="0" y="0" width="112" height="106" rx="8" fill="#D5E3D2" />
    <rect x="16" y="22" width="64" height="6" rx="3" fill="#5F7A61" opacity="0.65" />
    <rect x="16" y="38" width="78" height="5" rx="2.5" fill="#5F7A61" opacity="0.4" />
  </g>

  <!-- Eucalyptus Botanical Accent -->
  <g opacity="0.9">
    <path d="M625 480 C595 430, 588 380, 610 320" stroke="#5F7A61" stroke-width="3.2" stroke-linecap="round" />
    <ellipse cx="585" cy="422" rx="18" ry="12" transform="rotate(-28 585 422)" fill="#7A9A7D" />
    <ellipse cx="624" cy="402" rx="17" ry="11" transform="rotate(24 624 402)" fill="#8EAD90" />
    <ellipse cx="584" cy="368" rx="16" ry="11" transform="rotate(-22 584 368)" fill="#5F7A61" />
    <ellipse cx="622" cy="348" rx="15" ry="10" transform="rotate(28 622 348)" fill="#7A9A7D" />
  </g>
</svg>

