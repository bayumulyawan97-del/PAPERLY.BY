<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BA9448" />
      <stop offset="45%" stop-color="#E7CA82" />
      <stop offset="100%" stop-color="#A8823A" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#F6F2EA" />
  <circle cx="300" cy="300" r="190" fill="#E7EFE5" opacity="0.6" />
  <ellipse cx="300" cy="485" rx="150" ry="18" fill="#243026" opacity="0.1" />
  <!-- Mechanical Pencil Diagonal -->
  <g transform="translate(345 105) rotate(36)">
    <!-- Clicker & Eraser Cap -->
    <rect x="4" y="0" width="20" height="24" rx="6" fill="#5F7A61" />
    <rect x="2" y="24" width="24" height="14" rx="3" fill="#B79248" />
    <!-- Brass Body -->
    <rect x="0" y="38" width="28" height="280" rx="4" fill="url(#brassGrad)" />
    <!-- Pocket Clip -->
    <rect x="24" y="44" width="7" height="106" rx="3.5" fill="#475E49" />
    <!-- Knurled Grip -->
    <rect x="-1" y="236" width="30" height="86" rx="3" fill="#475E49" />
    <g stroke="#7A987C" stroke-width="1.5">
      <line x1="2" y1="248" x2="26" y2="248" />
      <line x1="2" y1="260" x2="26" y2="260" />
      <line x1="2" y1="272" x2="26" y2="272" />
      <line x1="2" y1="284" x2="26" y2="284" />
      <line x1="2" y1="296" x2="26" y2="296" />
      <line x1="2" y1="308" x2="26" y2="308" />
    </g>
    <!-- Tip Cone -->
    <polygon points="14,376 0,322 28,322" fill="url(#brassGrad)" />
    <rect x="12.5" y="376" width="3" height="16" fill="#243026" />
  </g>
  <!-- Lead Tube Accent -->
  <g transform="translate(360 362) rotate(-14)">
    <rect x="0" y="0" width="42" height="114" rx="8" fill="#5F7A61" />
    <rect x="6" y="0" width="30" height="20" rx="5" fill="#E59065" />
    <rect x="10" y="42" width="22" height="44" rx="4" fill="#FAF7F2" />
  </g>
</svg>

